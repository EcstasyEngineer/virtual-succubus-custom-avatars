# Install in BepInEx/config after backing up any existing file.
# Also set HideManagerGameObject=true in BepInEx.cfg [Chainloader].
# Put your VRM 0.x or 1.0 file directly in BepInEx/avatars.
# Start the game, then choose it in lobby Shapeshifting > Avatar model.
# The picker fills BundlePath and enables Replacement AND Face automatically.
# Original and one replacement are alternative choices; diagnostics are optional.
[Replacement]
Enabled = false
BundlePath =
# Ignored for raw VRM. A prepared FBX bundle needs its own prefab name.
Prefab =
# Scale the replacement so its head top matches the original (ignores ahoge/ears).
NormalizeHeight = true

# Required game targets: leave these values unchanged for the tested game.
[Target]
Scene = DontDestroyOnLoad
AnimatorPath = Pre-Game/CameraMenu (1)/Char3
RendererPaths =
AutomaticSession = true
CharacterMeshes = true
SessionScene = SessionScene
SessionAnimatorPath = Root/SceneContainer/Scene1 (Basic Scene)/SuccuPosition/GirlCharacter
SessionContainer = Root/SceneContainer
SessionCharacterName = GirlCharacter

# Optional: true starts each run with the in-game avatar debug launcher shown.
[Diagnostics]
Enabled = false

# Choosing a VRM in the picker automatically sets this to true.
# This flag controls native facial transfer, not generated speech or diagnostics.
[Face]
Enabled = false
